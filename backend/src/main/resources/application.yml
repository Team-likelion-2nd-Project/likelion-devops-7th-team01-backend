# application.yml
#
# 이 파일의 역할: 통합된 backend 서비스가 뜰 때 필요한 모든 설정값.
# Course/Enrollment가 각자 갖고 있던 DB 접속 정보가 이제 하나로 합쳐짐.
# course.service.url 같은 서비스 간 통신 설정은 더 이상 필요 없어서 삭제됨.

server:
  port: 8080
  tomcat:
    threads:
      max: 300
      min-spare: 30
    accept-count: 200        # 스레드가 다 찼을 때 대기열 크기 (부하 몰릴 때 완충 역할)

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:backend} # RDS 실제 DB명(course_registration)과 다름 → 환경변수로 주입
    username: ${DB_USER:backend}
    password: ${DB_PASSWORD}
    hikari:
      # M3-4 — db.t4g.micro 스펙 고려한 설정.
      # 근거는 docs/hikaricp-connection-pool.md 참고.
      # (2026-08-19 업데이트: k6 300명 부하테스트 중 커넥션 풀 고갈 확인,
      #  RDS max_connections=60 기준으로 재조정. 파드 min=3/max=5 x 15 = 최대 75)
      #  이론상 RDS 한도(60) 초과 가능하나, 실측(300명 부하)에서 RDS Connections 최대 58/60 확인 — 현재 조건 안전범위 내
      maximum-pool-size: 15
      minimum-idle: 15         # 부하 몰릴 때 새로 연결 만드는 지연 없도록 미리 다 켜둠
      connection-timeout: 15000
      max-lifetime: 600000
      idle-timeout: 300000
  jpa:
    open-in-view: false        # DB 커넥션을 요청 처리 끝까지 불필요하게 붙잡지 않도록
    hibernate:
      ddl-auto: validate   # Flyway가 스키마 관리, Hibernate는 검증만
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://cognito-idp.ap-northeast-3.amazonaws.com/ap-northeast-3_81iUULHdX/.well-known/jwks.json
          issuer-uri: https://cognito-idp.ap-northeast-3.amazonaws.com/ap-northeast-3_81iUULHdX
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: backend